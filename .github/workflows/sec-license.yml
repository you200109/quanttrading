name: Security License Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check licenses
        run: |
          if [ -f LICENSE ]; then
            echo '✅ LICENSE file exists'
            head -3 LICENSE
          else
            echo '⚠️ No LICENSE file found'
          fi
