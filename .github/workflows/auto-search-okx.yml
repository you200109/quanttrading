name: Auto Search OKX Projects
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search GitHub for OKX projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import requests, json, os
          from datetime import datetime
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          keywords = ['okx trading', 'okx api python', 'okx websocket', 'okx strategy', 'okx quant']
          results = []
          for kw in keywords:
              resp = requests.get(f'https://api.github.com/search/repositories?q={kw}&sort=stars&order=desc&per_page=5', headers=headers, timeout=15)
              if resp.status_code == 200:
                  for item in resp.json().get('items', []):
                      results.append({'name': item['full_name'], 'stars': item['stargazers_count'], 'url': item['html_url'], 'desc': (item.get('description') or '')[:80]})
          seen = set()
          unique = [r for r in results if not (r['name'] in seen or seen.add(r['name']))]
          unique.sort(key=lambda x: x['stars'], reverse=True)
          report = '# OKX Projects Search Report

'
          report += f'Search time: {datetime.now().isoformat()}

'
          report += f'Found {len(unique)} unique projects

'
          report += '| Project | Stars | Description |
|---------|-------|-------------|
'
          for r in unique[:15]:
              report += f"| [{r['name']}]({r['url']}) | {r['stars']} | {r['desc']} |
"
          with open('report.md', 'w') as f:
              f.write(report)
          print(f'Found {len(unique)} projects')
          "
      - name: Create issue with report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import requests, os
          token = os.environ['GH_TOKEN']
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          with open('report.md') as f:
              body = f.read()
          resp = requests.post(f'https://api.github.com/repos/{repo}/issues', headers=headers, json={'title': 'OKX Projects Search Report', 'body': body[:60000], 'labels': ['auto-search']}, timeout=15)
          print('Issue created' if resp.status_code == 201 else f'Issue failed: {resp.status_code}')
          "
