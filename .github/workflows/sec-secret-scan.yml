name: Security Secret Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          # 检查常见密钥模式
          FOUND=0
          if grep -rE '(ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16})' --include='*.py' --include='*.yml' --include='*.md' . 2>/dev/null | grep -v '.env.example'; then
            echo '⚠️ Potential secrets found!'
            FOUND=1
          fi
          if [ $FOUND -eq 0 ]; then
            echo '✅ No secrets detected'
          fi
