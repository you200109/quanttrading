name: OKX Open Source Scanner

on:
  schedule:
    - cron: '0 * * * *'  # 每小时执行
  workflow_dispatch:  # 支持手动触发

jobs:
  scan:
    name: Search OKX Projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install requests python-dotenv
      - name: Search GitHub for OKX projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import requests, json, os
          from datetime import datetime

          token = os.getenv('GITHUB_TOKEN', '')
          headers = {'Authorization': f'token {token}'} if token else {}

          queries = [
              'okx trading bot python',
              'okx api python',
              'okx quantitative trading',
              'okx websocket python',
              'okx backtest'
          ]

          results = []
          for q in queries:
              url = f'https://api.github.com/search/repositories?q={q}&sort=stars&order=desc&per_page=5'
              try:
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code == 200:
                      for repo in r.json().get('items', []):
                          results.append({
                              'query': q,
                              'full_name': repo['full_name'],
                              'stars': repo['stargazers_count'],
                              'description': repo.get('description', '')[:100],
                              'url': repo['html_url'],
                              'updated_at': repo['updated_at']
                          })
              except Exception as e:
                  print(f'Query {q} failed: {e}')

          output = {
              'timestamp': datetime.now().isoformat(),
              'total_found': len(results),
              'results': results
          }

          os.makedirs('reports', exist_ok=True)
          with open('reports/okx_scan_results.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          print(f'Found {len(results)} OKX-related projects')
          for r in results[:10]:
              print(f'  {r["full_name"]} ({r["stars"]} stars)')
          "
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: okx-scan-results
          path: reports/okx_scan_results.json
