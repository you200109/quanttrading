name: OKX Open Source Scanner

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan:
    name: Search OKX Projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Search GitHub for OKX projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/okx_scanner.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: okx-scan-results
          path: reports/okx_scan_results.json
