name: Deploy Staging
on:
  workflow_dispatch:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy to staging
        run: |
          echo '=== Staging Deployment ==='
          pip install -r requirements.txt -q
          python -c "from backend.main import app; print('Staging build verified:', app.title)"
          echo 'Staging deployment package ready'
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: staging-package
          path: |
            backend/
            frontend/
            requirements.txt
