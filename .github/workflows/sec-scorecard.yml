name: Security Scorecard
on:
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:
permissions: read-all
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2
        continue-on-error: true
