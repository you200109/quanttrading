name: CI Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', 'requirements.txt']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify imports
        run: |
          python -c "import fastapi, uvicorn, pandas, pandas_ta, okx, websockets, dotenv; print('All imports OK')"
      - name: Build check
        run: python -c "from backend.main import app; print('FastAPI app loaded:', app.title)"
