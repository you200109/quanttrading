name: Release Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: |
          pip install build
          if [ -f pyproject.toml ]; then
            python -m build || echo 'Build skipped (no pyproject)'
          else
            echo 'No pyproject.toml, creating source archive'
            tar -czf quanttrading-source.tar.gz --exclude='.git' --exclude='node_modules' .
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            *.tar.gz
          if-no-files-found: ignore
