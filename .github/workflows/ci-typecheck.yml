name: CI Type Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**']
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install mypy
      - name: Run mypy
        run: mypy backend/ --ignore-missing-imports --no-strict-optional || true
