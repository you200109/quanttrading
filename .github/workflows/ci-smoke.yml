name: CI Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install minimal deps
        run: pip install fastapi uvicorn python-dotenv
      - name: Start server and health check
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 8
          curl -s http://127.0.0.1:8000/health | grep -q 'ok' && echo 'Health check PASSED' || (echo 'Health check FAILED' && exit 1)
