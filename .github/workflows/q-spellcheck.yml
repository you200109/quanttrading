name: Quality Spellcheck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install codespell
        run: pip install codespell
      - name: Run spellcheck
        run: codespell --quiet-level=2 || echo 'Spellcheck complete with findings'
