name: CI Matrix Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-dotenv
      - name: Smoke test on ${{ matrix.os }} py${{ matrix.python-version }}
        run: python -c "import fastapi; print('OK on', '${{ matrix.os }}', 'py', '${{ matrix.python-version }}')"
