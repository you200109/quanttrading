name: Security Audit
on:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run security audit
        run: pip-audit -r requirements.txt --desc || echo 'Audit complete with warnings'
