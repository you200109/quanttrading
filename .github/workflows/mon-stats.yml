name: Monitor Repo Stats
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get repo stats via API
        run: |
          STATS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             https://api.github.com/repos/${{ github.repository }})
          echo "Stars: $(echo $STATS | python3 -c 'import json,sys; print(json.load(sys.stdin)["stargazers_count"])')"
          echo "Forks: $(echo $STATS | python3 -c 'import json,sys; print(json.load(sys.stdin)["forks_count"])')"
          echo "Open Issues: $(echo $STATS | python3 -c 'import json,sys; print(json.load(sys.stdin)["open_issues_count"])')"
          echo "Size: $(echo $STATS | python3 -c 'import json,sys; print(json.load(sys.stdin)["size"])') KB"
