name: Quality Complexity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install radon
        run: pip install radon
      - name: Analyze complexity
        run: |
          radon cc backend/ -s -n C | tail -20
          echo 'Complexity analysis complete'
