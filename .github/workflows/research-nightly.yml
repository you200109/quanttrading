name: research-nightly
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PAGES_URL: https://you200109.github.io/quanttrading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Carry over leaderboard from the live site
        run: |
          mkdir -p research/site/data
          curl -fsS "$PAGES_URL/data/leaderboard.json" -o /tmp/lb.json && mv /tmp/lb.json research/site/data/leaderboard.json || true
      - run: python research/nightly.py
      - run: python research/lifecycle_run.py
        env:
          TIMEFRAME: "1d"
          BARS: "600"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          APPROVED_PARAMS: ${{ vars.APPROVED_PARAMS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research/site
      - id: deploy
        uses: actions/deploy-pages@v5
