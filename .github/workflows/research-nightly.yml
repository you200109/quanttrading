name: research-nightly
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - run: python research/nightly.py
        env:
          PAGES_URL: https://you200109.github.io/quanttrading
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research/site
      - id: deploy
        uses: actions/deploy-pages@v4
