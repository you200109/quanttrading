name: Quality Duplication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pylint
        run: pip install pylint
      - name: Check code duplication
        run: |
          pylint backend/ --disable=all --enable=duplicate-code --score=n 2>/dev/null || echo 'Duplication check complete'
