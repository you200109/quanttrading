name: Quality Markdown Links
on:
  schedule:
    - cron: '0 21 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  md-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install link checker
        run: pip install linkchecker
      - name: Check links
        run: linkchecker README.md docs/ --no-status --ignore-url='localhost' || echo 'Link check complete'
