name: Security ZipSlip Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zipslip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for path traversal risks
        run: |
          # 检查代码中的路径拼接风险
          if grep -rE '(open\(.*\+|os\.path\.join\(.*input|Path\(.*\+)' --include='*.py' backend/ 2>/dev/null; then
            echo '⚠️ Potential path traversal patterns found, review needed'
          else
            echo '✅ No obvious path traversal risks'
          fi
