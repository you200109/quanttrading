name: Quality TODO Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
permissions:
  contents: read
jobs:
  todo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan TODOs
        run: |
          TODOS=$(grep -rn 'TODO\|FIXME\|HACK' --include='*.py' backend/ 2>/dev/null | wc -l)
          echo "Found $TODOS TODO/FIXME items"
          grep -rn 'TODO\|FIXME\|HACK' --include='*.py' backend/ 2>/dev/null | head -10 || echo 'No TODOs found'
