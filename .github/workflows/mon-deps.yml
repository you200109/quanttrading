name: Monitor Dependencies
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check outdated dependencies
        run: |
          pip install -r requirements.txt -q
          pip list --outdated | head -20 || echo 'All dependencies up to date'
