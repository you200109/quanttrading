name: Quality Coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**']
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps with coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Run coverage
        run: |
          if [ -d tests ] && find tests -name 'test_*.py' | grep -q .; then
            pytest tests/ --cov=backend --cov-report=term-missing || true
          else
            echo 'No tests, coverage of imports:'
            python -c "from backend.main import app; print('Import coverage OK')"
          fi
