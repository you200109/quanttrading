name: Auto Label
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
        continue-on-error: true
      - name: Fallback labeling
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue || context.payload.pull_request).title.toLowerCase();
            const labels = [];
            if (title.includes('bug') || title.includes('fix')) labels.push('bug');
            if (title.includes('feature') || title.includes('add')) labels.push('enhancement');
            if (title.includes('doc')) labels.push('documentation');
            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
