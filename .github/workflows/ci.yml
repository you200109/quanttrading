name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8 (main system)
        run: flake8 backend/ --count --max-line-length=120 --select=E9,F63,F7,F82 --show-source
      - name: Run flake8 (vigilant-couscous)
        run: flake8 vigilant-couscous/ --count --max-line-length=120 --select=E9,F63,F7,F82 --show-source

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run main system tests
        run: python -m pytest tests/ -v --tb=short -o addopts=''
      - name: Run vc tests
        run: |
          cd vigilant-couscous
          python -m pytest tests/ -v --tb=short -o addopts=''

  merge-check:
    name: Post-Merge Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Run merge check
        run: python scripts/post_merge_check.py
