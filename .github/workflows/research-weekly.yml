name: research-weekly
on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r research/requirements-agents.txt
      - run: python research/weekly.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGES_URL: https://you200109.github.io/quanttrading
