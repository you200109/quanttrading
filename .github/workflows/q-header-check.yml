name: Quality Header Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python file headers
        run: |
          COUNT=$(find backend -name '*.py' | wc -l)
          DOCSTRINGS=$(grep -l '"""' backend/**/*.py 2>/dev/null | wc -l)
          echo "Python files: $COUNT, with docstrings: $DOCSTRINGS"
