name: Quality Docs Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify docs exist
        run: |
          for doc in README.md docs/architecture.md docs/api-reference.md docs/deployment-guide.md; do
            if [ -f "$doc" ]; then
              echo "✅ $doc exists"
            else
              echo "⚠️ $doc missing"
            fi
          done
