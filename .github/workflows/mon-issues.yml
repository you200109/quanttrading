name: Monitor Issues
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Issue statistics
        run: |
          ISSUES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             "https://api.github.com/repos/${{ github.repository }}/issues?state=open&per_page=100")
          COUNT=$(echo $ISSUES | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "Open issues: $COUNT"
