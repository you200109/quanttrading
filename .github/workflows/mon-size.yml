name: Monitor Repo Size
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check repo size
        run: |
          SIZE=$(du -sh --exclude=.git . | cut -f1)
          echo "Repository content size: $SIZE"
          if [ $(du -s --exclude=.git . | cut -f1) -gt 1000000 ]; then
            echo '⚠️ Repository exceeds 1GB, consider cleanup'
          else
            echo '✅ Repository size is healthy'
          fi
