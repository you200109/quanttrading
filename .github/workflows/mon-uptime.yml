name: Monitor Uptime
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actions availability check
        run: |
          # 检查 GitHub Actions 服务可用性
          curl -s -o /dev/null -w '%{http_code}' https://api.github.com/ | grep -q '200' &&             echo '✅ GitHub API is UP' || echo '⚠️ GitHub API check failed'
