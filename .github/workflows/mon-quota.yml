name: Monitor Actions Quota
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Actions usage
        run: |
          USAGE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             https://api.github.com/repos/${{ github.repository }}/actions/cache/usage || echo '{}')
          echo 'Actions quota monitoring complete'
          echo 'Note: Free tier includes 2000 minutes/month'
