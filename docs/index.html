<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantTrading</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0a0e1a; color: #e0e0e0; }
        .header { background: linear-gradient(135deg, #0f1729, #1a2342); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e2a4a; }
        .header h1 { font-size: 20px; color: #00d4ff; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .ws-status { font-size: 12px; color: #888; }
        .ws-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 4px; }
        .ws-dot.connected { background: #00e676; }
        .mode-btn { padding: 6px 16px; border: 1px solid #2a3a5a; background: transparent; color: #888; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .mode-btn.active { background: #1a5fb4; color: #fff; border-color: #1a5fb4; }
        .container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 16px; }
        .card { background: #111827; border: 1px solid #1e2a4a; border-radius: 8px; padding: 16px; }
        .card h2 { font-size: 14px; color: #00d4ff; margin-bottom: 12px; }
        .card.full-width { grid-column: 1 / -1; }
        .card.two-thirds { grid-column: 1 / 3; }
        .ticker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .ticker-item { background: #0d1421; padding: 12px; border-radius: 6px; text-align: center; }
        .ticker-item .symbol { font-size: 13px; color: #888; }
        .ticker-item .price { font-size: 20px; font-weight: bold; color: #00d4ff; margin: 4px 0; }
        .up { color: #00e676; }
        .down { color: #ff5252; }
        .chart-container { position: relative; height: 320px; }
        .form-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .form-row label { font-size: 13px; color: #888; min-width: 70px; }
        .form-row input, .form-row select { background: #0d1421; border: 1px solid #2a3a5a; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; font-size: 13px; flex: 1; }
        .btn { background: #1a5fb4; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 8px; }
        .btn:hover { background: #2a6fc4; }
        .btn.secondary { background: #2a3a5a; }
        .result-box { background: #0d1421; border: 1px solid #1e2a4a; border-radius: 6px; padding: 10px; margin-top: 8px; font-size: 12px; max-height: 180px; overflow-y: auto; }
        .ob-table { width: 100%; font-size: 12px; }
        .ob-table td { padding: 3px 8px; }
        .ind-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .ind-item { background: #0d1421; padding: 8px; border-radius: 4px; text-align: center; }
        .ind-item .name { font-size: 11px; color: #888; }
        .ind-item .val { font-size: 16px; font-weight: bold; color: #00d4ff; }
        .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
        .tab { padding: 6px 16px; background: #0d1421; border: 1px solid #2a3a5a; color: #888; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 13px; }
        .tab.active { background: #1a5fb4; color: #fff; border-color: #1a5fb4; }
    </style>
</head>
<body>
    <div class="header">
        <h1>QuantTrading</h1>
        <div class="header-right">
            <span class="ws-status"><span class="ws-dot" id="wsDot"></span><span id="wsText">未连接</span></span>
            <button class="mode-btn active" id="demoBtn" onclick="switchMode('demo')">模拟盘</button>
            <button class="mode-btn" id="liveBtn" onclick="switchMode('live')">实盘</button>
        </div>
    </div>
    <div class="container">
        <div class="card full-width">
            <h2>实时行情</h2>
            <div class="ticker-grid" id="tickerGrid"><div class="ticker-item"><div class="symbol">加载中</div></div></div>
        </div>
        <div class="card two-thirds">
            <h2>K线图表</h2>
            <div class="form-row">
                <label>交易对</label>
                <select id="klineSymbol" onchange="loadKlines()"><option>BTC-USDT</option><option>ETH-USDT</option><option>SOL-USDT</option></select>
                <label>周期</label>
                <select id="klineBar" onchange="loadKlines()"><option value="1H">1小时</option><option value="1D">日线</option></select>
                <button class="btn secondary" onclick="downloadHistory()" style="margin:0;padding:4px 12px">下载CSV</button>
            </div>
            <div class="chart-container"><canvas id="klineChart"></canvas></div>
        </div>
        <div class="card">
            <h2>盘口深度</h2>
            <table class="ob-table" id="orderbookTable"><tr><td>加载中</td></tr></table>
        </div>
        <div class="card">
            <h2>指标计算</h2>
            <div class="form-row">
                <label>指标</label>
                <select id="indicatorSelect"><option value="RSI">RSI</option><option value="SMA">SMA</option><option value="EMA">EMA</option><option value="MACD">MACD</option><option value="BBL">布林带</option><option value="STOCH">随机指标</option></select>
                <label>周期</label>
                <input type="number" id="indicatorPeriod" value="14" style="max-width:60px">
            </div>
            <button class="btn" onclick="calculateIndicators()">计算指标</button>
            <div class="ind-grid" id="indicatorGrid"><div class="ind-item"><div class="name">等待计算</div></div></div>
        </div>
        <div class="card">
            <h2>策略回测</h2>
            <div class="form-row"><label>策略</label><select id="strategySelect"><option value="ma_cross">均线交叉</option><option value="rsi_reversal">RSI反转</option></select></div>
            <div class="form-row"><label>参数1</label><input type="number" id="param1" value="5"></div>
            <div class="form-row"><label>参数2</label><input type="number" id="param2" value="20"></div>
            <button class="btn" onclick="runBacktest()">运行回测</button>
            <div class="result-box" id="backtestResult">等待回测</div>
        </div>
        <div class="card">
            <h2>AGI进化</h2>
            <div class="form-row"><label>状态</label><span id="agiStatus">未连接</span></div>
            <button class="btn" onclick="triggerEvolve()">触发进化</button>
            <button class="btn secondary" onclick="loadAGIStatus()">刷新</button>
            <div class="result-box"  id="agiResult">等待操作</div>
            <div class="form-row" style="margin-top:8px"><label>GitHub学习</label></div>
            <button class="btn" onclick="triggerLearn()">触发学习</button>
            <div class="result-box" id="learnResult">等待操作</div>
        </div>
        <div class="card">
            <h2>风控系统</h2>
            <div class="form-row"><label>最大仓位</label><span id="riskMaxPos">20%</span></div>
            <div class="form-row"><label>最大回撤</label><span id="riskMaxDD">15%</span></div>
            <div class="form-row"><label>当前回撤</label><span id="riskCurrentDD">0%</span></div>
            <button class="btn secondary" onclick="loadRiskStatus()">刷新风控</button>
        </div>
        <div class="card">
            <h2>记忆存储</h2>
            <div class="form-row"><label>数据文件</label><span id="nexusCount">-</span></div>
            <button class="btn secondary" onclick="loadNexus()">加载列表</button>
            <div class="result-box" id="nexusResult">等待操作</div>
        </div>
    </div>
    <script>
        let klineChart = null;
        let wsMarket = null;
        let currentKlineData = null;

        function switchMode(mode) {
            document.getElementById('demoBtn').classList.toggle('active', mode === 'demo');
            document.getElementById('liveBtn').classList.toggle('active', mode === 'live');
            loadTickers();
        }

        async function loadTickers() {
            try {
                const r = await fetch('/api/tickers?inst_type=SPOT');
                const d = await r.json();
                if (d.code === 0 && d.data) {
                    document.getElementById('tickerGrid').innerHTML = d.data.slice(0, 6).map(function(t) {
                        var ch = parseFloat(t.last) - parseFloat(t.open24h);
                        var cp = (ch / parseFloat(t.open24h) * 100).toFixed(2);
        var cls = ch >= 0 ? 'up' : 'down';
        return '<div class="ticker-item"><div class="symbol">' + t.instId + '</div><div class="price">$' + parseFloat(t.last).toLocaleString() + '</div><div class="' + cls + '">' + cp + '%</div></div>';
    }).join('');
                }
            } catch(e) {}
        }

        async function loadKlines() {
            var sym = document.getElementById('klineSymbol').value;
            var bar = document.getElementById('klineBar').value;
            try {
                var r = await fetch('/api/klines/' + sym + '?bar=' + bar + '&limit=100');
                var d = await r.json();
                if (d.code === 0 && d.data) {
                    currentKlineData = d.data;
                    var labels = d.data.map(function(c) { return new Date(parseInt(c[0])).toLocaleDateString(); });
                    var closes = d.data.map(function(c) { return parseFloat(c[4]); });
                    if (klineChart) klineChart.destroy();
                    klineChart = new Chart(document.getElementById('klineChart'), {
                        type: 'line',
                        data: { labels: labels, datasets: [{ label: sym, data: closes, borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.08)', borderWidth: 2, fill: true, tension: 0.3 }] },
                        options: { responsive: true, maintainAspectRatio: false, scales: { x: { ticks: { color: '#666', maxTicksLimit: 10 } }, y: { ticks: { color: '#888' } } }
                    });
                }
            } catch(e) {}
        }

        async function loadOrderbook() {
            var sym = document.getElementById('klineSymbol').value;
            try {
                var r = await fetch('/api/orderbook/' + sym + '?depth=5');
                var d = await r.json();
                if (d.code === 0 && d.data) {
                    var asks = d.data.asks || [];
                    var bids = d.data.bids || [];
                    var h = '';
                    asks.slice(0, 5).reverse().forEach(function(a) { h += '<tr><td class="down">' + parseFloat(a[0]).toFixed(2) + '</td><td>' + parseFloat(a[1]).toFixed(4) + '</td></tr>'; });
                    h += '<tr><td colspan="2" style="text-align:center;color:#666">--- 盘口 ---</td></tr>';
                    bids.slice(0, 5).forEach(function(b) { h += '<tr><td class="up">' + parseFloat(b[0]).toFixed(2) + '</td><td>' + parseFloat(b[1]).toFixed(5) + '</td></tr>'; });
        document.getElementById('orderbookTable').innerHTML = h;
    }
            } catch(e) {}
        }

        async function calculateIndicators() {
            var indicator = document.getElementById('indicatorSelect').value;
            var period = parseInt(document.getElementById('indicatorPeriod').value);
            var sym = document.getElementById('klineSymbol').value;
    var bar = document.getElementById('klineBar').value;
    try {
        var body = { inst_id: sym, bar: bar, indicators: [indicator], limit: '100' };
        var r = await fetch('/api/indicators/calculate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        var d = await r.json();
        if (d.code === 0 && d.data) {
        var recent = d.data.slice(-5).reverse();
        var html = recent.map(function(row) {
            var val = row[indicator] !== undefined ? row[indicator].toFixed(4) : 'N/A';
        var ts = row.ts ? new Date(row.ts).toLocaleDateString() : '';
        return '<div class="ind-item"><div class="name">' + ts + '</div><div class="val">' + val + '</div></div>';
        }).join('');
        document.getElementById('indicatorGrid').innerHTML = html;
    }
    } catch(e) { document.getElementById('indicatorGrid').innerHTML = '<div class="ind-item"><div class="name">计算失败</div></div>'; }
}

async function runBacktest() {
    var body = { inst_id: document.getElementById('klineSymbol').value, bar: document.getElementById('klineBar').value, strategy: document.getElementById('strategySelect').value, params: { fast: parseInt(document.getElementById('param1').value), slow: parseInt(document.getElementById('param2').value) }, limit: '300' };
    try {
        var r = await fetch('/api/backtest', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        var result = await r.json();
        document.getElementById('backtestResult').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
    } catch(e) { document.getElementById('backtestResult').innerHTML = '错误: ' + e; }
}

async function loadAGIStatus() {
    try {
        var r = await fetch('/api/vc/agi/status');
        var d = await r.json();
        if (d.code === 0) { document.getElementById('agiStatus').textContent = d.data.status || 'unknown'; }
    } catch(e) {}
}

async function triggerEvolve() {
    try {
        var r = await fetch('/api/vc/agi/evolve', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
        var d = await r.json();
        document.getElementById('agiResult').innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    } catch(e) { document.getElementById('agiResult').innerHTML = '错误: ' + e; }
}

async function triggerLearn() {
    try {
        var r = await fetch('/api/vc/github/learn', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({n_repos: 3}) });
        var d = await r.json();
        document.getElementById('learnResult').innerHTML = '<pre>Found ' + d.count + ' repos</pre>';
    } catch(e) { document.getElementById('learnResult').innerHTML = '错误: ' + e; }
}

async function loadRiskStatus() {
    try {
        var r = await fetch('/api/vc/risk/status');
    var d = await r.json();
    if (d.code === 0 && d.data) {
        if (d.data.limits) {
            document.getElementById('riskMaxPos').textContent = (d.data.limits.max_position_pct * 100).toFixed(0) + '%';
            document.getElementById('riskMaxDD').textContent = (d.data.limits.max_drawdown_pct * 100).toFixed(0) + '%';n        }
        if (d.data.current_drawdown !== undefined) {
            document.getElementById('riskCurrentDD').textContent = (d.data.current_drawdown * 100).toFixed(1) + '%';
        }
    }
    } catch(e) {}
}

async function loadNexus() {
    try {
        var r = await fetch('/api/vc/memory/nexus');
        var d = document.getElementById('nexusResult');
        var rj = await r.json();
        if (rj.code === 0) {
            document.getElementById('nexusCount').textContent = rj.count + ' files';
            d.innerHTML = rj.data.map(function(f) { return f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)'; }).join('<br>');
        }
    } catch(e) {}
}

function downloadHistory() {
    var sym = document.getElementById('klineSymbol').value;
    var bar = document.getElementById('klineBar').value;
    window.open('/api/history/download?inst_id=' + sym + '&bar=' + bar + '&limit=500', '_blank');
}

        function connectWebSocket() {
            var sym = document.getElementById('klineSymbol').value;
            var wsUrl = 'ws://localhost:8000/ws/market?inst_id=' + sym;
            try {
                wsMarket = new WebSocket(wsUrl);
                wsMarket.onopen = function() {
                    document.getElementById('wsDot').classList.add('connected');
                    document.getElementById('wsText').textContent = '实时连接';
                };
                wsMarket.onmessage = function(event) {
                    try {
                        var data = JSON.parse(event.data);
                        if (data.last) {
                            var items = document.getElementsByClassName('ticker-item');
                            for (var i = 0; i < items.length; i++) {
                                if (items[i].querySelector('.symbol').textContent === sym) {
                                    items[i].querySelector('.price').textContent = '$' + parseFloat(data.last).toLocaleString();
                                }
                            }
                        }
                    } catch(e) {}
                };
                wsMarket.onclose = function() {
                    document.getElementById('wsDot').classList.remove('connected');
    document.getElementById('wsText').textContent = '已断开';
                    setTimeout(connectWebSocket, 10000);
                };
            } catch(e) {}
        }

        loadTickers();
        loadKlines();
        loadOrderbook();
        loadAGIStatus();
        loadRiskStatus();
        setInterval(loadTickers, 10000);
        setInterval(loadOrderbook, 5000);
        setTimeout(connectWebSocket, 2000);
    </script>
</body>
</html>
