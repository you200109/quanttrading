version: '3.8'

services:
  web:
    build: .
    container_name: self-evolve-web
    ports:
      - "8765:8765"
    volumes:
      - ./memory:/app/memory
      - ./reports:/app/reports
      - ./strategies:/app/strategies
    environment:
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      - OKX_DEMO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    container_name: self-evolve-scheduler
    command: python auto_evolve_scheduler.py --interval 15
    volumes:
      - ./memory:/app/memory
      - ./reports:/app/reports
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - web
