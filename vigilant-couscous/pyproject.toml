[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolution-trading"
version = "0.1.0"
description = "自进化交易系统 - 多Agent协同、GitHub学习、400轮迭代的AI交易平台"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "you200109"}
]
keywords = ["trading", "evolution", "reinforcement-learning", "genetic-algorithm", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "apscheduler>=3.10.0",
    "websocket-client>=1.6.0",
    "ccxt>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "isort>=5.13.0",
]
rl = [
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",
    "torch>=2.1.0",
]
ml = [
    "openai>=1.6.0",
    "anthropic>=0.8.0",
]
monitoring = [
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
]
all = [
    "self-evolution-trading[dev,rl,ml,monitoring]",
]

[project.urls]
Homepage = "https://github.com/you200109/-"
Repository = "https://github.com/you200109/-.git"

[tool.setuptools]
packages = ["agents", "data", "evolution", "strategies", "agi", "core"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=. --cov-report=term --cov-report=xml"
